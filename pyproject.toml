[build-system]
requires = [
    "setuptools>=61",
]
build-backend = "setuptools.build_meta"

[project]
name = "movie-lens-recommender"
version = "0.1.0"
description = "MovieLens recommender system using matrix factorization."
requires-python = ">=3.8"
dependencies = [
    "annoy==1.17.3",
    "matplotlib==3.7.2",
    "numpy==1.25.2",
    "pandas==2.0.3",
    "scikit-learn==1.3.0",
    "torch==2.0.1",
    "tqdm==4.66.1",
    "umap-learn==0.5.5",
]

[project.scripts]
recommender-train = "recommender.train:main"
recommender-recommend = "recommender.recommend:main"
recommender-baselines = "recommender.baselines:main"

[tool.setuptools.packages.find]
where = ["src"]
